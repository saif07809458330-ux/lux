<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
        <"link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
        #withdraw-section {
    margin-top: 20px;
    padding: 20px;
    border-top: 2px solid #eee;
    text-align: center;
}

.withdraw-method {
    margin-bottom: 15px;
}

.withdraw-btn {
    background-color: #f0f0f0;
    border: 1px solid #ccc;
    padding: 10px 20px;
    border-radius: 8px;
    width: 100%;
    max-width: 300px; /* لجعل الأزرار متناسقة */
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: background-color 0.3s;
}

.withdraw-btn:hover {
    background-color: #e0e0e0;
}

.payment-icon {
    width: 30px;  /* حجم الصور */
    height: 30px; /* حجم الصور */
    margin-right: 15px; /* مسافة بين الصورة والكتابة */
    object-fit: contain;
}

.details-content {
    margin-top: 10px;
    padding: 15px;
    background-color: #f9f9f9;
    border-radius: 8px;
    border: 1px solid #ddd;
    max-width: 300px;
    margin-left: auto;
    margin-right: auto;
}

.details-content input {
    width: 90%;
    padding: 8px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

.confirm-btn {
    background-color: #27ae60; /* لون أخضر لتأكيد الطلب */
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 4px;
    cursor: pointer;
}
  body { background-color: #0b1329; color: white; font-family: sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
  .main-app { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
  .btn { display: block; width: 100%; padding: 18px; background: #0ea5e9; border: none; border-radius: 12px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; box-sizing: border-box; }
  #login-layer { position: fixed; top:0; left:0; width:100%; height:100%; background: #0b1329; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
  .input-box { padding: 12px; width: 100%; max-width: 300px; border-radius: 8px; border: 1px solid #334155; background: #111e38; color: white; text-align: right; margin-bottom: 12px; font-size: 15px; }
  .points-card { background: #111e38; border: 1px solid #1e3a8a; border-radius: 14px; padding: 16px; text-align: center; margin-bottom: 10px; }
</style>
</head>
<body>

<div id="login-layer">
  <h3 style="color:#fbbf24; margin-bottom: 15px;">إنشاء حساب جديد</h3>
  <input type="email" id="userEmail" class="input-box" placeholder="أدخل البريد الإلكتروني (Gmail)">
  <input type="password" id="userPass" class="input-box" placeholder="كلمة السر (4 أحرف أو أرقام على الأقل)">
  <button onclick="doLogin()" class="btn" style="max-width: 300px;">إنشاء الحساب والدخول</button>
</div>

<div class="main-app">
  <div class="points-card">
    <h3 style="margin:0; color:#fbbf24;">⭐ نقاطك</h3>
    <p style="font-size: 26px; font-weight: bold; color: #38bdf8; margin: 5px 0 0 0;" id="points">0</p>
  </div>
  
  <a href="https://www.mobilerewards.link/wall/n6q5WwGF" target="_blank" class="btn">🚀 ابدأ الربح</a>
  <button onclick="getGift()" class="btn">🎁 الجوائز</button>
  <a href="https://t.me/syf5v5f1" target="_blank" class="btn">👥 المجتمع</a>
  <button onclick="alert('الحد الأدنى للسحب 500 نقطة')" class="btn">💵 سحب</button>
  <button onclick="doLogout()" class="btn" style="background:#dc2626;">تسجيل خروج / حذف الحساب</button>
</div>

<script>
  window.onload = function() {
    let savedUser = localStorage.getItem('app_email');
    if (!savedUser) {
      document.getElementById('login-layer').style.display = 'flex';
    } else {
      document.getElementById('login-layer').style.display = 'none';
      document.getElementById('points').innerText = localStorage.getItem('app_pts') || '0';
    }
  };

  function doLogin() {
    let email = document.getElementById('userEmail').value.trim();
    let pass = document.getElementById('userPass').value.trim();
    
    if (!email.includes('@') || email.length < 5) {
      alert("❌ يرجى إدخال بريد إلكتروني (Gmail) صحيح");
      return;
    }
    if (pass.length < 4) {
      alert("❌ كلمة السر يجب أن تكون 4 خانات على الأقل");
      return;
    }

    localStorage.setItem('app_email', email);
    if(!localStorage.getItem('app_pts')) {
      localStorage.setItem('app_pts', '0');
    }
    location.reload();
  }

  function getGift() {
    let last = localStorage.getItem('lastDate');
    let today = new Date().toDateString();
    if (last === today) { 
      alert("تم استلام الجائزة اليوم، عد غداً!"); 
      return; 
    }
    
    let current = parseInt(localStorage.getItem('app_pts') || '0');
    let reward = Math.floor(Math.random() * 10) + 1;
    let newTotal = current + reward;
    
    localStorage.setItem('app_pts', newTotal);
    localStorage.setItem('lastDate', today);
    document.getElementById('points').innerText = newTotal;
    alert("مبروك! ربحت " + reward + " نقطة");
  }

  function doLogout() {
    localStorage.clear();
    location.reload();
  }
</script>

    <!-- باقي محتوى الصفحة القديم عندك -->
    <div id="login-layer">
        <h3 style="color:#Fbbf24; margin-bottom: 15px;">إشاء حساب جديد</h3>
    </div>

    <!-- اخليه هنا جوه الـ body: قسم وسائل السحب -->
    <section id="withdraw-section">
        <h2>وسائل سحب الأرباح</h2>
        <p>اختر طريقة السحب المفضلة لديك:</p>

        <!-- خيار رصيد آسيا سييل -->
        <div class="withdraw-method">
            <button class="withdraw-btn" onclick="toggleDetails('asiacell-details')">
                <img src="[رابط شعار آسيا سييل]" alt="Asiacell" class="payment-icon">
                رصيد آسيا سييل (5$)
            </button>
            <div id="asiacell-details" class="details-content" style="display: none;">
                <p>أدخل رقم هاتفك لإرسال الرصيد:</p>
                <input type="text" placeholder="0770xxxxxxx">
                <button class="confirm-btn">إرسال الطلب</button>
            </div>
        </div>

        <!-- خيار بطاقة جوجل بلاي -->
        <div class="withdraw-method">
            <button class="withdraw-btn" onclick="toggleDetails('googleplay-details')">
                <img src="[رابط بطاقة جوجل بلاي]" alt="Google Play" class="payment-icon">
                بطاقة جوجل بلاي (5$)
            </button>
            <div id="googleplay-details" class="details-content" style="display: none;">
                <p>سيتم إرسال الكود إلى إيميلك:</p>
                <button class="confirm-btn">تأكيد الطلب</button>
            </div>
        </div>

        <!-- خيار بطاقة الماستر كارد -->
        <div class="withdraw-method">
            <button class="withdraw-btn" onclick="toggleDetails('mastercard-details')">
                <img src="[رابط شعار الماستر كارد]" alt="Mastercard" class="payment-icon">
                بطاقة ماستر كارد / زين كاش
            </button>
            <div id="mastercard-details" class="details-content" style="display: none;">
                <p>أدخل رقم البطاقة أو المحفظة:</p>
                <input type="text" placeholder="أدخل الرقم هنا...">
                <button class="confirm-btn">إرسال الطلب</button>
            </div>
        </div>
    </section>

    <!-- كود الجافاسكريبت للفتح والإغلاق -->
    <script>
        function toggleDetails(detailsId) {
            var content = document.getElementById(detailsId);
            if (content.style.display === "none") {
                var allDetails = document.querySelectorAll('.details-content');
                allDetails.forEach(function(detail) { detail.style.display = "none"; });
                content.style.display = "block";
            } else {
                content.style.display = "none";
            }
        }
    </script>

</body>
</html>
